<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Block Coding Application</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400&display=swap');

        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-2: #14b8a6;
            --badge: #eef2ff;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 22px 40px;
        }

        header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel h2 span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: #ebf2ff;
            color: var(--accent);
            font-weight: 700;
            font-size: 12px;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 700px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .project-card {
            width: 100%;
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            background: #fbfdff;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
        }

        .project-card:hover {
            border-color: #c7d2fe;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
            transform: translateY(-1px);
        }

        .project-card.selected {
            border-color: var(--accent);
            box-shadow: 0 10px 26px rgba(37, 99, 235, 0.16);
            background: #eef2ff;
        }

        .project-card h3 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 700;
        }

        .project-card p {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--badge);
            color: #4338ca;
            font-weight: 600;
            font-size: 12px;
        }

        .blocks-area {
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 12px;
        }

        .blocks-board {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            min-height: 320px;
            background: #f9fafb;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .block-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            background: var(--card);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }

        .block-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .block-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
            background: var(--badge);
            color: #312e81;
        }

        .order-pill {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            background: #fff;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .detail {
            padding: 8px 10px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }

        .detail strong {
            display: block;
            color: var(--text);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        button.secondary {
            background: #f9fafb;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: var(--accent);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .output {
            background: #0f172a;
            color: #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            min-height: 240px;
            max-height: 380px;
            overflow-y: auto;
            font-family: 'DM Mono', 'Menlo', monospace;
            border: 1px solid #1f2937;
        }

        .log-entry {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            align-items: center;
        }

        .log-entry .type {
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            color: #0f172a;
            background: #dbeafe;
        }

        .log-entry .text {
            word-break: break-word;
        }

        .empty-state, .loading {
            text-align: center;
            padding: 26px 10px;
            color: var(--muted);
        }

        .loading .spinner {
            margin: 0 auto 10px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Block Coding Console</h1>
            <p>프로젝트 선택 → 블록 흐름 확인 → 실행/트레이스 로그 확인</p>
        </header>

        <div class="layout">
            <aside class="panel">
                <h2><span>1</span>Projects</h2>
                <div id="projectList" class="project-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading projects...</p>
                    </div>
                </div>
            </aside>

            <main class="panel blocks-area">
                <div>
                    <h2><span>2</span>Blocks</h2>
                    <div id="blocksSection" class="blocks-board">
                        <div class="empty-state">
                            <p>프로젝트를 선택하면 블록 흐름이 나타납니다.</p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="controls">
                        <button id="runBtn" class="primary" onclick="runProject(false)" disabled>▶ Run</button>
                        <button id="runTraceBtn" onclick="runProject(true)" disabled class="secondary">🔍 Trace Run</button>
                        <button onclick="clearOutput()" class="secondary">🗑 Clear Output</button>
                    </div>
                </div>

                <div>
                    <h2><span>3</span>Execution Output</h2>
                    <div id="output" class="output"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let stompClient = null;
        let currentSessionId = null;
        let selectedProjectId = null;

        window.onload = () => loadProjects();

        function loadProjects() {
            fetch('/api/projects')
                .then(response => response.json())
                .then(projects => {
                    displayProjects(projects);
                })
                .catch(error => {
                    console.error('Error loading projects:', error);
                    document.getElementById('projectList').innerHTML =
                        '<div class="empty-state"><i>❌</i><p>Failed to load projects</p></div>';
            });
        }

        function displayProjects(projects) {
            const projectList = document.getElementById('projectList');

            if (projects.length === 0) {
                projectList.innerHTML =
                    '<div class="empty-state"><p>프로젝트가 없습니다.</p></div>';
                return;
            }

            projectList.innerHTML = projects.map(project => `
                <button class="project-card" data-id="${project.id}" onclick="selectProject(event, ${project.id})">
                    <h3>${escapeHtml(project.name)}</h3>
                    <p>${escapeHtml(project.description || 'No description')}</p>
                    <span class="chip">ID: ${project.id}</span>
                </button>
            `).join('');
        }

        function selectProject(event, projectId) {
            selectedProjectId = projectId;

            document.querySelectorAll('.project-card').forEach(item => {
                item.classList.toggle('selected', item.dataset.id === String(projectId));
            });

            setRunButtonsDisabled(false);

            loadBlocks(projectId);
        }

        function setRunButtonsDisabled(disabled) {
            document.getElementById('runBtn').disabled = disabled;
            document.getElementById('runTraceBtn').disabled = disabled;
        }

        function loadBlocks(projectId) {
            const blocksSection = document.getElementById('blocksSection');
            blocksSection.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading blocks...</p></div>';

            fetch(`/api/blocks/project/${projectId}`)
                .then(response => response.json())
                .then(blocks => {
                    displayBlocks(blocks);
                })
                .catch(error => {
                    console.error('Error loading blocks:', error);
                    blocksSection.innerHTML =
                        '<div class="empty-state"><p>블록을 불러올 수 없습니다.</p></div>';
                });
        }

        function displayBlocks(blocks) {
            const blocksSection = document.getElementById('blocksSection');

            if (blocks.length === 0) {
                blocksSection.innerHTML =
                    '<div class="empty-state"><p>이 프로젝트에는 블록이 없습니다.</p></div>';
                return;
            }

            const timeline = `
                <div class="timeline">
                    ${blocks.map(block => `
                        <div class="block-card">
                            <div class="block-head">
                                <div class="block-meta">
                                    <span class="badge ${block.blockType}">${block.blockType}</span>
                                    <span class="order-pill">Order ${block.order ?? '-'}</span>
                                    <span class="chip">Next: ${block.nextBlockId ?? block.trueBranchId ?? '-'}</span>
                                </div>
                                <span class="chip">ID: ${block.id}</span>
                            </div>
                            <div class="details">
                                ${getBlockDetails(block)}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            blocksSection.innerHTML = timeline;
        }

        function getBlockDetails(block) {
            const details = [];

            if (block.message) details.push(detailItem('Message', formatValue(block.message)));
            if (block.condition) details.push(detailItem('Condition', formatValue(block.condition)));
            if (block.variableName) details.push(detailItem('Variable', `${escapeHtml(block.variableName)} (id:${block.variableId ?? '-'}, type:${block.variableType ?? '-'})`));
            if (block.initial) details.push(detailItem('Initial', formatValue(block.initial)));
            if (block.value) details.push(detailItem('Value', formatValue(block.value)));
            if (block.operand1 || block.resultVariable) {
                details.push(detailItem('Operands', `${formatValue(block.operand1)} , ${formatValue(block.operand2 || '')}`));
                details.push(detailItem('Result', `${escapeHtml(block.resultVariable || '')} (id:${block.resultVariableId ?? '-'})`));
            }
            if (block.trueBranchId) details.push(detailItem('True Branch', block.trueBranchId));
            if (block.falseBranchId) details.push(detailItem('False Branch', block.falseBranchId));

            return details.length > 0 ? details.join('') : detailItem('Info', 'No extra data');
        }

        function detailItem(label, value) {
            return `<div class="detail"><strong>${escapeHtml(label)}</strong>${escapeHtml(String(value))}</div>`;
        }

        function formatValue(valueDto) {
            if (!valueDto) return '-';
            if (typeof valueDto === 'string') return valueDto;
            try {
                return JSON.stringify(valueDto);
            } catch (_) {
                return String(valueDto);
            }
        }

        function connect(sessionId) {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);

                stompClient.subscribe('/topic/execution/' + sessionId, function (message) {
                    const data = JSON.parse(message.body);
                    showOutput(data);
                });
            });
        }

        function runProject(traceEnabled) {
            if (!selectedProjectId) {
                alert('Please select a project first');
                return;
            }

            clearOutput();
            setRunButtonsDisabled(true);

            const url = '/api/execution/projects/' + selectedProjectId + '/run' +
                    (traceEnabled ? '?trace=true' : '');

            fetch(url, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                currentSessionId = data.sessionId;
                console.log('Session ID:', currentSessionId);
                connect(currentSessionId);
                showOutput({type: 'INFO', data: (traceEnabled ? 'Trace' : 'Run') + ' started for project ID: ' + selectedProjectId});
            })
            .catch(error => {
                console.error('Error:', error);
                showOutput({type: 'ERROR', data: 'Failed to start execution: ' + error.message});
                setRunButtonsDisabled(false);
            });

            setTimeout(() => {
                setRunButtonsDisabled(false);
            }, 3000);
        }

        function showOutput(message) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'log-entry';

            const timestamp = new Date().toLocaleTimeString();
            const dataStr = typeof message.data === 'string' ? message.data : JSON.stringify(message.data);

            div.innerHTML = `
                <span class="type ${message.type}">${escapeHtml(message.type)}</span>
                <div class="text">[${timestamp}] ${escapeHtml(dataStr)}</div>
            `;

            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text ? String(text).replace(/[&<>"']/g, m => map[m]) : '';
        }
    </script>
</body>
</html>
