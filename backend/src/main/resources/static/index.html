<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Block Coding Application</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
        }

        .project-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .project-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .project-item.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
        }

        .project-item h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .project-item p {
            color: #666;
            font-size: 0.9em;
        }

        .blocks-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .blocks-table th,
        .blocks-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .blocks-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .blocks-table tr:hover {
            background: #f5f5f5;
        }

        .block-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }

        .block-type.START { background-color: #2196F3; }
        .block-type.PRINT { background-color: #9C27B0; }
        .block-type.ALERT { background-color: #FFC107; color: #333; }
        .block-type.DRAW { background-color: #4CAF50; }
        .block-type.ADD,
        .block-type.SUBTRACT,
        .block-type.MULTIPLY,
        .block-type.DIVIDE { background-color: #FF9800; }
        .block-type.VAR_DECLARE,
        .block-type.VAR_ASSIGN { background-color: #8BC34A; }
        .block-type.IF,
        .block-type.FOR,
        .block-type.WHILE { background-color: #E91E63; }

        #output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 4px solid;
        }

        .message.START { border-color: #2196F3; background-color: #e3f2fd20; }
        .message.PRINT { border-color: #9C27B0; background-color: #f3e5f520; }
        .message.ALERT { border-color: #FFC107; background-color: #fff9c420; }
        .message.DRAW { border-color: #4CAF50; background-color: #e8f5e920; }
        .message.ADD,
        .message.SUBTRACT,
        .message.MULTIPLY,
        .message.DIVIDE { border-color: #FF9800; background-color: #ffe0b220; }
        .message.VAR_DECLARE,
        .message.VAR_ASSIGN { border-color: #8BC34A; background-color: #f1f8e920; }
        .message.IF,
        .message.FOR,
        .message.WHILE { border-color: #E91E63; background-color: #e1bee720; }
        .message.ERROR { border-color: #f44336; background-color: #ffcdd220; }
        .message.COMPLETE { border-color: #4CAF50; background-color: #c8e6c920; font-weight: bold; }
        .message.INFO { border-color: #2196F3; background-color: #e3f2fd20; }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state i {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Block Coding Application</h1>
            <p>Visual Programming Platform - Create, View, and Execute Block Programs</p>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <h2 class="section-title">Projects</h2>
                <div id="projectList" class="project-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading projects...</p>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="section">
                    <h2 class="section-title">Blocks</h2>
                    <div id="blocksSection">
                        <div class="empty-state">
                            <i>📦</i>
                            <p>Select a project to view its blocks</p>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Execution Output</h2>
                    <div class="action-buttons">
                        <button id="runBtn" onclick="runProject()" disabled>▶ Run Project</button>
                        <button onclick="clearOutput()">🗑 Clear Output</button>
                    </div>
                    <div id="output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let currentSessionId = null;
        let selectedProjectId = null;

        // Load projects on page load
        window.onload = function() {
            loadProjects();
        };

        function loadProjects() {
            fetch('/api/projects')
                .then(response => response.json())
                .then(projects => {
                    displayProjects(projects);
                })
                .catch(error => {
                    console.error('Error loading projects:', error);
                    document.getElementById('projectList').innerHTML =
                        '<div class="empty-state"><i>❌</i><p>Failed to load projects</p></div>';
                });
        }

        function displayProjects(projects) {
            const projectList = document.getElementById('projectList');

            if (projects.length === 0) {
                projectList.innerHTML =
                    '<div class="empty-state"><i>📭</i><p>No projects found</p></div>';
                return;
            }

            projectList.innerHTML = projects.map(project => `
                <div class="project-item" onclick="selectProject(${project.id})">
                    <h3>${escapeHtml(project.name)}</h3>
                    <p>${escapeHtml(project.description || 'No description')}</p>
                    <small style="color: #999;">ID: ${project.id}</small>
                </div>
            `).join('');
        }

        function selectProject(projectId) {
            selectedProjectId = projectId;

            // Update UI
            document.querySelectorAll('.project-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            // Enable run button
            document.getElementById('runBtn').disabled = false;

            // Load blocks
            loadBlocks(projectId);
        }

        function loadBlocks(projectId) {
            const blocksSection = document.getElementById('blocksSection');
            blocksSection.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading blocks...</p></div>';

            fetch(`/api/blocks/project/${projectId}`)
                .then(response => response.json())
                .then(blocks => {
                    displayBlocks(blocks);
                })
                .catch(error => {
                    console.error('Error loading blocks:', error);
                    blocksSection.innerHTML =
                        '<div class="empty-state"><i>❌</i><p>Failed to load blocks</p></div>';
                });
        }

        function displayBlocks(blocks) {
            const blocksSection = document.getElementById('blocksSection');

            if (blocks.length === 0) {
                blocksSection.innerHTML =
                    '<div class="empty-state"><i>📭</i><p>No blocks in this project</p></div>';
                return;
            }

            const table = `
                <table class="blocks-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Type</th>
                            <th>Details</th>
                            <th>Next Block</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${blocks.map(block => `
                            <tr>
                                <td>${block.order}</td>
                                <td><span class="block-type ${block.blockType}">${block.blockType}</span></td>
                                <td>${getBlockDetails(block)}</td>
                                <td>${block.nextBlockId || block.trueBranchId || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            blocksSection.innerHTML = table;
        }

        function getBlockDetails(block) {
            const details = [];

            if (block.message) details.push(`Message: "${escapeHtml(block.message)}"`);
            if (block.conditionExpression) details.push(`Condition: ${escapeHtml(block.conditionExpression)}`);
            if (block.variableName) details.push(`Variable: ${escapeHtml(block.variableName)}`);
            if (block.initialValue) details.push(`Value: ${escapeHtml(block.initialValue)}`);
            if (block.operand1) details.push(`${escapeHtml(block.operand1)} op ${escapeHtml(block.operand2)} → ${escapeHtml(block.resultVariable)}`);
            if (block.trueBranchId) details.push(`True→${block.trueBranchId}`);
            if (block.falseBranchId) details.push(`False→${block.falseBranchId}`);

            return details.length > 0 ? details.join(', ') : '-';
        }

        function connect(sessionId) {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);

                stompClient.subscribe('/topic/execution/' + sessionId, function (message) {
                    const data = JSON.parse(message.body);
                    showOutput(data);
                });
            });
        }

        function runProject() {
            if (!selectedProjectId) {
                alert('Please select a project first');
                return;
            }

            clearOutput();
            document.getElementById('runBtn').disabled = true;

            fetch('/api/execution/projects/' + selectedProjectId + '/run', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                currentSessionId = data.sessionId;
                console.log('Session ID:', currentSessionId);
                connect(currentSessionId);
                showOutput({type: 'INFO', data: 'Execution started for project ID: ' + selectedProjectId});
            })
            .catch(error => {
                console.error('Error:', error);
                showOutput({type: 'ERROR', data: 'Failed to start execution: ' + error.message});
                document.getElementById('runBtn').disabled = false;
            });

            // Re-enable button after 3 seconds
            setTimeout(() => {
                document.getElementById('runBtn').disabled = false;
            }, 3000);
        }

        function showOutput(message) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'message ' + message.type;

            const timestamp = new Date().toLocaleTimeString();
            const dataStr = typeof message.data === 'string' ? message.data : JSON.stringify(message.data);
            div.textContent = `[${timestamp}] [${message.type}] ${dataStr}`;

            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text ? String(text).replace(/[&<>"']/g, m => map[m]) : '';
        }
    </script>
</body>
</html>
